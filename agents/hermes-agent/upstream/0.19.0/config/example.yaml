hermes:
  model:
    provider: custom:litellm
    default: qwen3.5-9b
  custom_providers:
    - name: litellm
      base_url: "http://GATEWAY-IP:4000/v1"
      api_key: "KEY-PLACEHOLDER"
      models:
        - qwen3.5-9b
  display:
    language: zh-CN
---
hermes-env:
  HERMES_API_TIMEOUT: 60
  HERMES_API_CALL_STALE_TIMEOUT: 120
  HERMES_STREAM_READ_TIMEOUT: 300
  HERMES_STREAM_STALE_TIMEOUT: 60
  HERMES_LANGUAGE: en
  HERMES_OPENROUTER_CACHE: false
  HERMES_OPENROUTER_CACHE_TTL: 5m
  HERMES_QUIET: false
  HERMES_YOLO_MODE: false