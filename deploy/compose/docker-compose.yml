# docker-compose for marketplace-api.
#
# Usage:
#   cp /path/to/config/config.yaml ../config/config.yaml  # if not already there
#   cp ../config/.env.example ./.env  # then edit ./.env to set MARKETPLACE_API_PASSWORD
#                                      # compose auto-loads ./.env for ${VAR} expansion
#   EXTERNAL_IP=192.168.8.101 ./gen-tls.sh   # generate self-signed cert (one-time, or when IP changes)
#   docker compose up
#   docker compose restart  # after pushing new tarballs to dist/
#
# The dist/ directory is bind-mounted READ-ONLY from the host. The
# container never writes to dist/. To pick up new packages, push them
# to dist/ on the host and run `docker compose restart`.
#
# The skills-data/ directory is bind-mounted READ-WRITE — that's the
# upload target for `agentpkg skills upload`. Skills and agent tarballs
# are stored in physically separate paths because agent tarballs are
# immutable from the marketplace's perspective (operators push them;
# the marketplace only serves them) while skills are uploaded at any
# time by community authors.

services:
  marketplace-api:
    image: quay.io/vmware-ai/agent-marketplace-api:latest
    container_name: marketplace-api
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      MARKETPLACE_API_PASSWORD: "${MARKETPLACE_API_PASSWORD}"
    volumes:
      # Config (read-only) — lives in deploy/config/ alongside this compose file
      - ../config/config.yaml:/etc/agent-marketplace/config.yaml:ro
      # TLS cert + key (read-only). Generate self-signed with
      # ./gen-tls.sh, or drop your own CA-signed files into
      # deploy/tls/ to override.
      - ../tls:/etc/agent-marketplace/tls:ro
      # dist/ contents (tarballs + sha256 + index.json) — read-only
      - ../../dist:/var/lib/agent-marketplace/dist:ro
      # skills-data/ contents (skill zips + skills-index.json + .tmp/)
      # — read-write. Created on first up if missing (see
      # start_marketplace_docker.sh). Distinct filesystem location
      # from dist/ so the read-only mount above doesn't break uploads.
      - ../../skills-data:/var/lib/agent-marketplace/skills:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "https://localhost:8443/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s