# marketplace-api configuration example
#
# Copy to config.yaml and edit. Do NOT commit config.yaml — it contains
# deployment-specific paths and (optionally) secrets.

server:
  listen: "0.0.0.0:8443"
  # TLS — required in production. Set both cert and key paths.
  tls_cert: "/etc/letsencrypt/live/marketplace.example.com/fullchain.pem"
  tls_key: "/etc/letsencrypt/live/marketplace.example.com/privkey.pem"

auth:
  # Password is read from this environment variable at startup.
  # Do NOT hardcode the password here.
  password_env: "MARKETPLACE_API_PASSWORD"

repo:
  # Directory containing tarballs, sha256 files, and index.json.
  # Production: bind-mounted from host into the container at /var/lib/agent-marketplace/dist
  dist_dir: "/var/lib/agent-marketplace/dist"

logging:
  # debug | info | warn | error
  level: "info"